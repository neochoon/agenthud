# CodeRabbit configuration — governs review BEHAVIOR for this repo and takes
# precedence over the CodeRabbit dashboard UI. It does NOT replace the GitHub
# App installation: the CodeRabbit app must still be installed for repo access,
# and this file is only read once the app can see the repo.
# Schema: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  # "assertive" = the profile already in use (surfaces more nitpicks/edge cases).
  profile: assertive
  # Auto-approve once review issues are fixed (modern field; replaces deprecated
  # request_changes_workflow which is not in the official schema).
  auto_approvals:
    enabled: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    # Review automatically on push (the current behavior we want version-locked).
    enabled: true
    # Incremental re-review on each new push to an open PR. Guard against quota
    # exhaustion by pausing after N consecutive reviewed commits.
    auto_incremental_review: true
    # Pause reviews after 3 consecutive reviewed commits to avoid quota burn.
    # On limited plans (~1 review/hour), this prevents exhaustion in hours.
    auto_pause_after_reviewed_commits: 3
    # Skip draft PRs — review once they're marked ready.
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
